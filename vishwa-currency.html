<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>विश्व करेंसी</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#E9F0EC; --card:#FFFFFF; --ink:#12302B; --muted:#5B7570; --line:#CFDCD6;
  --gold:#9A6F1C; --hero:#12302B; --hero-text:#F3EBD6; --hero-accent:#E8B94E;
  --focus:#1F6F5F; --chip:#EEF4F1;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1815; --card:#15262A; --ink:#E6EFEA; --muted:#8FA9A2; --line:#28403A;
    --gold:#E8B94E; --hero:#1D3A32; --hero-text:#F3EBD6; --hero-accent:#E8B94E;
    --focus:#6FD1BC; --chip:#1B312F;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:17px; line-height:1.5;
  min-height:100vh;
}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Yatra One","Mukta",serif;font-weight:400;font-size:34px;line-height:1.2}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.pick{margin-top:18px;position:relative}
.field-label{font-size:14px;color:var(--muted);margin-bottom:4px;font-weight:600}
.box{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;cursor:pointer;
}
.box .flag{font-size:30px;line-height:1}
.box .txt{flex:1;min-width:0}
.box .nm{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .cd{font-size:14px;color:var(--muted)}
.box .chev{color:var(--muted);font-size:14px}

.swap-row{display:flex;justify-content:center;margin:-6px 0 -10px;position:relative;z-index:2}
.swap{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);font-size:20px;cursor:pointer;
}

.amount{margin-top:16px}
.amount input{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 14px;font-size:20px;font-weight:600;
}

.result{
  margin-top:18px;background:var(--hero);color:var(--hero-text);
  border-radius:18px;padding:18px 18px 16px;
}
.result .small{font-size:15px;opacity:.85}
.result .big{
  font-family:"Yatra One","Mukta",serif;font-size:36px;line-height:1.2;
  color:var(--hero-accent);margin:4px 0 6px;word-break:break-word;
}
.result .rate{font-size:15px;opacity:.9}

.status{font-size:13px;color:var(--muted);margin-top:10px}

h2{font-family:"Yatra One","Mukta",serif;font-weight:400;font-size:24px;margin-top:30px}
.rank-sub{color:var(--muted);font-size:14px;margin:2px 0 10px}
.rsearch{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:10px 14px;font-size:17px;margin-bottom:10px;
}
.rank{list-style:none;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.rank li{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--line);
}
.rank li:last-child{border-bottom:0}
.rank li[data-code]{cursor:pointer}
.rank li[data-code]:hover{background:var(--chip)}
.sheet.note{height:auto;max-height:90vh;overflow-y:auto;padding-bottom:20px}
.ntitle{flex:1;font-family:"Yatra One","Mukta",serif;font-size:22px;line-height:1.25}
.nbody{padding:4px 16px 8px}
.notecard{width:100%;height:auto;display:block;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{
  border:1.5px solid var(--line);background:var(--chip);border-radius:999px;
  padding:6px 14px;font-weight:600;cursor:pointer;
}
.chip.on{background:var(--hero);color:var(--hero-text);border-color:var(--hero)}
.nmeta{color:var(--muted);font-size:14px;margin-top:10px}
button.nlink{border:0;width:100%;cursor:pointer;font:inherit;font-weight:700}
.allnotes{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.onenote .nmeta{margin-top:4px}
.htitle{font-family:"Yatra One","Mukta",serif;font-weight:400;font-size:20px;margin-top:18px}
.hist{margin-top:8px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.hist p{margin:8px 0}
.hist h2,.hist h3,.hist h4{font-size:16px;margin:14px 0 4px;font-family:inherit}
.hist ul,.hist ol{padding-left:20px;margin:6px 0}
.tscroll{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.hist table{border-collapse:collapse;font-size:13px;min-width:100%}
.hist th,.hist td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.hist th{background:var(--chip)}
.hist img{max-width:160px;height:auto;display:block}
.realnote{width:100%;height:auto;display:block;border-radius:12px;background:var(--chip);min-height:90px;object-fit:contain}
.nlink{
  display:block;text-align:center;margin-top:14px;padding:12px;border-radius:14px;
  background:var(--hero);color:var(--hero-text);font-weight:700;text-decoration:none;
}
.rank .no{width:34px;text-align:right;font-weight:700;font-size:18px;color:var(--muted);flex:none}
.rank li.top .no{color:var(--gold)}
.rank .flag{font-size:26px;flex:none}
.rank .mid{flex:1;min-width:0}
.rank .cn{font-weight:700;line-height:1.25}
.rank .more{font-size:13px;color:var(--muted);line-height:1.3}
.rank .val{font-weight:600;font-size:15px;text-align:right;flex:none;max-width:44%;word-break:break-word}

/* picker sheet */
.overlay{
  position:fixed;inset:0;background:rgba(5,15,12,.55);display:none;
  align-items:flex-end;justify-content:center;z-index:50;
}
.overlay.open{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:520px;height:82vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;
}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sheet-head input{
  flex:1;background:var(--chip);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:17px;
}
.close{
  width:44px;height:44px;border-radius:12px;border:0;background:var(--chip);
  font-size:18px;cursor:pointer;
}
.list{overflow-y:auto;flex:1;padding:0 6px 16px;-webkit-overflow-scrolling:touch}
.item{
  width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;
  padding:10px 10px;border-radius:12px;text-align:left;cursor:pointer;
}
.item:hover{background:var(--chip)}
.item.sel{background:var(--chip);font-weight:700}
.item .flag{font-size:26px}
.item .cd{margin-left:auto;color:var(--muted);font-size:14px}
.empty{padding:24px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>विश्व करेंसी</h1>
  <p class="sub">दुनिया के सभी देशों की करेंसी, एक जगह</p>

  <div class="pick">
    <div class="field-label">पहला देश</div>
    <button class="box" id="boxFrom" type="button" aria-haspopup="dialog"></button>
  </div>

  <div class="swap-row"><button class="swap" id="swap" type="button" aria-label="दोनों देश बदलें">⇅</button></div>

  <div class="pick" style="margin-top:0">
    <div class="field-label">दूसरा देश</div>
    <button class="box" id="boxTo" type="button" aria-haspopup="dialog"></button>
  </div>

  <div class="amount">
    <div class="field-label">पहले देश की राशि</div>
    <input id="amt" type="number" inputmode="decimal" min="0" value="1">
  </div>

  <div class="result" aria-live="polite">
    <div class="small" id="rSmall"></div>
    <div class="big" id="rBig"></div>
    <div class="rate" id="rRate"></div>
  </div>
  <p class="status" id="status"></p>

  <h2>सबसे मज़बूत करेंसी</h2>
  <p class="rank-sub" id="rankSub"></p>
  <input class="rsearch" id="rsearch" type="search" placeholder="रैंकिंग में देश खोजें" autocomplete="off" aria-label="रैंकिंग में देश खोजें">
  <ol class="rank" id="rank"></ol>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="देश चुनें">
    <div class="sheet-head">
      <input id="search" type="search" placeholder="देश या करेंसी खोजें" autocomplete="off">
      <button class="close" id="close" type="button" aria-label="बंद करें">✕</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<div class="overlay" id="noteOverlay">
  <div class="sheet note" role="dialog" aria-modal="true" aria-label="देश का नोट">
    <div class="sheet-head">
      <div class="ntitle" id="nTitle"></div>
      <button class="close" id="nClose" type="button" aria-label="बंद करें">✕</button>
    </div>
    <div class="nbody" id="nBody"></div>
  </div>
</div>

const countries = RAW.trim().split('\n').map(l => {
  const [iso, name, code, rate] = l.split('|');
  return { iso, name, code, rate: +rate };
});
const byIso = {}; countries.forEach(c => byIso[c.iso] = c);
const rates = {}; countries.forEach(c => rates[c.code] = c.rate);
const MAIN = { EUR:'DE', USD:'US', XOF:'SN', XAF:'CM', XCD:'AG', AUD:'AU', CHF:'CH', ILS:'IL' };

const flag = iso => String.fromCodePoint(...[...iso].map(ch => 127397 + ch.charCodeAt(0)));
const $ = id => document.getElementById(id);

let from = 'US', to = 'IN', picking = null;

function fmt(n) {
  if (!isFinite(n)) return '—';
  if (n === 0) return '0';
  const a = Math.abs(n);
  if (a >= 1) return n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  return String(Number(n.toPrecision(4)));
}

function boxHtml(c) {
  return `<span class="flag">${flag(c.iso)}</span>
    <span class="txt"><div class="nm">${c.name}</div><div class="cd">करेंसी: ${c.code}</div></span>
    <span class="chev">▼</span>`;
}

function render() {
  const f = byIso[from], t = byIso[to];
  $('boxFrom').innerHTML = boxHtml(f);
  $('boxTo').innerHTML = boxHtml(t);

  const amount = parseFloat($('amt').value);
  const a = isFinite(amount) ? amount : 0;
  const unit = rates[t.code] / rates[f.code];

  $('rSmall').textContent = `${fmt(a)} ${f.code} (${f.name}) बराबर`;
  $('rBig').textContent = `${fmt(a * unit)} ${t.code}`;
  $('rRate').textContent = `1 ${f.code} = ${fmt(unit)} ${t.code}  ·  1 ${t.code} = ${fmt(1 / unit)} ${f.code}`;

  renderRank();
}

function renderRank() {
  const t = byIso[to];
  $('rankSub').textContent = `जिसकी 1 यूनिट की क़ीमत सबसे ज़्यादा, वह नंबर 1। क़ीमत ${t.code} में दिखाई गई है।`;

  const groups = {};
  countries.forEach(c => (groups[c.code] = groups[c.code] || []).push(c));
  const codes = Object.keys(groups).sort((x, y) => rates[x] - rates[y]);

  const q = ($('rsearch').value || '').trim().toLowerCase();
  const rows = codes.map((code, i) => ({ code, i })).filter(({ code }) =>
    !q || code.toLowerCase().includes(q) ||
    groups[code].some(c => c.name.toLowerCase().includes(q)));

  if (!rows.length) {
    $('rank').innerHTML = '<li style="display:block;text-align:center;color:var(--muted);padding:22px">कोई देश नहीं मिला। दूसरा नाम लिखकर खोजें।</li>';
    return;
  }

  $('rank').innerHTML = rows.map(({ code, i }) => {
    const list = groups[code];
    const hit = q ? list.find(c => c.name.toLowerCase().includes(q)) : null;
    const main = hit || list.find(c => c.iso === MAIN[code]) || list[0];
    const others = list.filter(c => c !== main);
    let more = `करेंसी: ${code}`;
    if (others.length) {
      const names = others.slice(0, 2).map(c => c.name).join(', ');
      more += ` · ${names}${others.length > 2 ? ` और ${others.length - 2} देश` : ''}`;
    }
    const v = rates[t.code] / rates[code];
    return `<li class="${i < 3 ? 'top' : ''}" data-code="${code}" data-iso="${main.iso}" tabindex="0" role="button" aria-label="${main.name} का नोट देखें">
      <span class="no">${i + 1}</span>
      <span class="flag">${flag(main.iso)}</span>
      <span class="mid"><div class="cn">${main.name}</div><div class="more">${more}</div></span>
      <span class="val">1 ${code} = ${fmt(v)} ${t.code}</span>
    </li>`;
  }).join('');
}

/* picker */
function openPicker(which) {
  picking = which;
  $('search').value = '';
  drawList('');
  $('overlay').classList.add('open');
  setTimeout(() => $('search').focus(), 50);
}
function closePicker() { $('overlay').classList.remove('open'); picking = null; }

function drawList(q) {
  q = q.trim().toLowerCase();
  const cur = picking === 'from' ? from : to;
  const items = countries
    .filter(c => !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q))
    .sort((a, b) => a.name.localeCompare(b.name, 'hi'));
  $('list').innerHTML = items.length
    ? items.map(c => `<button class="item ${c.iso === cur ? 'sel' : ''}" type="button" data-iso="${c.iso}">
        <span class="flag">${flag(c.iso)}</span><span>${c.name}</span><span class="cd">${c.code}</span>
      </button>`).join('')
    : '<div class="empty">कोई देश नहीं मिला। दूसरा नाम लिखकर खोजें।</div>';
}

$('boxFrom').onclick = () => openPicker('from');
$('boxTo').onclick = () => openPicker('to');
$('close').onclick = closePicker;
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closePicker(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
$('search').addEventListener('input', e => drawList(e.target.value));
$('list').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  if (picking === 'from') from = b.dataset.iso; else to = b.dataset.iso;
  closePicker(); render();
});
$('swap').onclick = () => { [from, to] = [to, from]; render(); };
$('amt').addEventListener('input', render);
$('rsearch').addEventListener('input', renderRank);

/* नोट देखना */
const NOTES = {
  USD:[1,2,5,10,20,50,100], EUR:[5,10,20,50,100,200,500], INR:[10,20,50,100,200,500],
  GBP:[5,10,20,50], JPY:[1000,2000,5000,10000], CNY:[1,5,10,20,50,100],
  CHF:[10,20,50,100,200,1000], AUD:[5,10,20,50,100], CAD:[5,10,20,50,100],
  KWD:[0.25,0.5,1,5,10,20], SAR:[5,10,50,100,200,500], AED:[5,10,20,50,100,200,500,1000],
  PKR:[10,20,50,100,500,1000,5000], BDT:[2,5,10,20,50,100,500,1000],
  NPR:[5,10,20,50,100,500,1000], LKR:[20,50,100,500,1000,5000],
  KRW:[1000,5000,10000,50000], SGD:[2,5,10,50,100,1000], THB:[20,50,100,500,1000],
  MYR:[1,5,10,20,50,100], IDR:[1000,2000,5000,10000,20000,50000,100000],
  RUB:[100,200,500,1000,2000,5000], BRL:[2,5,10,20,50,100,200],
  MXN:[20,50,100,200,500,1000], ZAR:[10,20,50,100,200], TRY:[5,10,20,50,100,200],
  NZD:[5,10,20,50,100], SEK:[20,50,100,200,500,1000], NOK:[50,100,200,500,1000],
  DKK:[50,100,200,500,1000], EGP:[5,10,20,50,100,200], QAR:[1,5,10,50,100,500],
  BHD:[0.5,1,5,10,20], OMR:[0.1,0.2,0.5,1,5,10,20,50], JOD:[1,5,10,20,50],
  BTN:[1,5,10,20,50,100,500,1000], MVR:[5,10,20,50,100,500]
};
let note = { iso: null, code: null, idx: 0 };

function hueOf(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }

function noteSVG(c, value, idx, uid = '0') {
  const h = (hueOf(c.code) + idx * 22) % 360;
  const bg1 = `hsl(${h},48%,80%)`, bg2 = `hsl(${(h + 30) % 360},45%,66%)`;
  const ink = `hsl(${h},50%,24%)`;
  let rings = '';
  for (let r = 16; r <= 120; r += 10) rings += `<circle cx="238" cy="82" r="${r}" fill="none" stroke="${ink}" stroke-opacity=".22" stroke-width="1.2"/>`;
  const big = value !== null ? String(value) : '';
  return `<svg class="notecard" viewBox="0 0 320 168" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${c.name} की करेंसी ${c.code} के नोट का नमूना">
    <defs>
      <linearGradient id="ng${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg1}"/><stop offset="1" stop-color="${bg2}"/></linearGradient>
      <clipPath id="nc${uid}"><rect x="0" y="0" width="320" height="168" rx="12"/></clipPath>
    </defs>
    <rect width="320" height="168" rx="12" fill="url(#ng${uid})"/>
    <g clip-path="url(#nc${uid})">${rings}</g>
    <rect x="8" y="8" width="304" height="152" rx="8" fill="none" stroke="${ink}" stroke-opacity=".6" stroke-width="2"/>
    <rect x="14" y="14" width="292" height="140" rx="5" fill="none" stroke="${ink}" stroke-opacity=".3" stroke-width="1"/>
    <text x="26" y="62" font-size="44" font-weight="700" fill="${ink}" font-family="Mukta,sans-serif">${big}</text>
    <text x="26" y="88" font-size="16" font-weight="700" fill="${ink}" font-family="Mukta,sans-serif" letter-spacing="1">${c.code}</text>
    <text x="270" y="44" font-size="30" text-anchor="middle">${flag(c.iso)}</text>
    <text x="26" y="140" font-size="17" font-weight="700" fill="${ink}" font-family="Mukta,sans-serif">${c.name}</text>
    <text x="296" y="140" font-size="26" font-weight="700" text-anchor="end" fill="${ink}" fill-opacity=".55" font-family="Mukta,sans-serif">${big}</text>
  </svg>`;
}

function renderNote() {
  const c = byIso[note.iso];
  const notes = NOTES[note.code];
  const value = notes ? notes[note.idx] : null;
  const same = countries.filter(x => x.code === note.code);
  const others = same.filter(x => x !== c);

  $('nTitle').textContent = `${flag(c.iso)} ${c.name}`;
  const pk = note.code + '|' + value;
  const ph = photoCache[pk];
  let h = ph
    ? `<img class="realnote" src="${ph.url}" alt="${ph.title}"><div class="nmeta">${ph.title}</div>`
    : noteSVG(c, value, note.idx);
  if (photoLoading === pk) h += `<p class="nmeta">इस नोट की असली फ़ोटो लोड हो रही है…</p>`;
  if (notes) {
    h += `<div class="chips">` + notes.map((v, i) =>
      `<button class="chip ${i === note.idx ? 'on' : ''}" type="button" data-i="${i}">${v} ${note.code}</button>`).join('') + `</div>`;
  }
  h += `<p class="nmeta">करेंसी: ${note.code}${others.length ? ` · यही करेंसी ${others.length} और देश भी चलाते हैं` : ''}</p>`;
  if (!ph) h += `<p class="nmeta">यह नमूना डिज़ाइन है। रक़म के बटन दबाने पर उस नोट की असली फ़ोटो खोजी जाती है, और नीचे के बटन से शुरू से अब तक के सारे नोट दिखते हैं।</p>`;
  h += `<button class="nlink" id="allBtn" type="button">${note.all ? 'नोट छिपाएँ' : 'असली नोट देखें'}</button>`;
  if (note.all) {
    const hs = histCache[note.code];
    if (hs === undefined) {
      h += `<p class="nmeta">शुरू से अब तक के नोटों की जानकारी लोड हो रही है…</p>`;
    } else if (hs && hs.html) {
      h += `<h3 class="htitle">शुरू से अब तक के नोट</h3>`;
      h += `<p class="nmeta">हर नोट के साथ बनने और बंद होने की तारीख़ें तालिका में हैं (अंग्रेज़ी में)। तालिका खिसकाकर देखें।</p>`;
      h += `<div class="hist">${hs.html}</div>`;
      h += `<p class="nmeta">स्रोत: विकिपीडिया, "${hs.title}"</p>`;
    } else {
      h += `<p class="nmeta">नोटों की जानकारी लोड नहीं हो पाई। इंटरनेट चालू है या नहीं देखें। तब तक नमूना नोट दिख रहे हैं।</p>`;
      if (notes) {
        h += `<div class="allnotes">` + notes.map((v, i) =>
          `<div class="onenote">${noteSVG(c, v, i, 'a' + i)}<div class="nmeta">${v} ${note.code}</div></div>`).join('') + `</div>`;
      }
    }
  }
  $('nBody').innerHTML = h;
}

function openNote(iso, code) {
  note = { iso, code, idx: 0, all: false };
  renderNote();
  $('noteOverlay').querySelector('.sheet').scrollTop = 0;
  $('noteOverlay').classList.add('open');
}
const histCache = {};
const photoCache = {};
let photoLoading = null;
function engName(type, key) {
  try { return new Intl.DisplayNames(['en'], { type }).of(key); } catch (e) { return key; }
}
async function commonsSearch(q) {
  const u = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=15'
    + '&gsrsearch=' + encodeURIComponent(q)
    + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=700&format=json&origin=*';
  const r = await fetch(u);
  const d = await r.json();
  const pages = d && d.query ? Object.values(d.query.pages) : [];
  return pages
    .filter(p => p.imageinfo && p.imageinfo[0] && /^image\/(jpeg|png)/.test(p.imageinfo[0].mime))
    .sort((a, b) => a.index - b.index)
    .map(p => ({
      url: p.imageinfo[0].thumburl || p.imageinfo[0].url,
      title: p.title.replace(/^File:/, '').replace(/\.[a-z]+$/i, '').replace(/_/g, ' ')
    }))
    .slice(0, 10);
}
async function loadPhoto(code) {
  const notes = NOTES[code]; if (!notes) return;
  const value = notes[note.idx];
  const pk = code + '|' + value;
  if (pk in photoCache) return;
  photoLoading = pk; renderNote();
  const cur = engName('currency', code);
  let found = null;
  try {
    for (const q of [`${cur} ${value} banknote`, `${code} ${value} banknote`, `${value} ${cur}`]) {
      const list = await commonsSearch(q);
      found = list.find(p => p.title.includes(String(value))) || null;
      if (found) break;
    }
  } catch (e) { found = null; }
  photoCache[pk] = found;
  if (photoLoading === pk) photoLoading = null;
  if (note.code === code) renderNote();
}

async function wikiApi(params) {
  const r = await fetch('https://en.wikipedia.org/w/api.php?' + params + '&format=json&formatversion=2&origin=*');
  return r.json();
}

function cleanWiki(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,sup.reference,.mw-editsection,.navbox,.hatnote,.ambox,.noprint,.metadata,.reflist').forEach(n => n.remove());
  doc.querySelectorAll('a').forEach(a => a.replaceWith(...a.childNodes));
  doc.querySelectorAll('img').forEach(im => {
    let s = im.getAttribute('src') || '';
    if (s.startsWith('//')) s = 'https:' + s;
    im.setAttribute('src', s);
    ['srcset', 'width', 'height'].forEach(k => im.removeAttribute(k));
    im.setAttribute('loading', 'lazy');
  });
  doc.querySelectorAll('table').forEach(t => {
    const w = doc.createElement('div'); w.className = 'tscroll';
    t.replaceWith(w); w.appendChild(t);
  });
  doc.querySelectorAll('*').forEach(n => {
    n.removeAttribute('style');
    [...n.attributes].forEach(a => { if (/^on/i.test(a.name)) n.removeAttribute(a.name); });
  });
  return doc.body.innerHTML;
}

async function loadHistory(code) {
  if (histCache[code]) return;
  let res = { html: null };
  try {
    const cur = engName('currency', code);
    const s = await wikiApi('action=query&list=search&srlimit=1&srsearch=' + encodeURIComponent(cur));
    const title = s.query.search[0].title;
    const t = encodeURIComponent(title);
    const sec = await wikiApi('action=parse&prop=sections&redirects=1&page=' + t);
    const list = sec.parse.sections.map(x => ({ index: x.index, line: x.line.replace(/<[^>]+>/g, '') }));
    const pick = list.find(x => /^banknotes?$/i.test(x.line))
      || list.find(x => /banknote|paper money/i.test(x.line))
      || list.find(x => /^history$/i.test(x.line));
    if (pick) {
      const p = await wikiApi('action=parse&prop=text&disableeditsection=1&redirects=1&section=' + pick.index + '&page=' + t);
      res = { html: cleanWiki(p.parse.text), title };
    }
  } catch (e) { res = { html: null }; }
  histCache[code] = res;
  if (note.code === code && note.all) renderNote();
}
function closeNote() { $('noteOverlay').classList.remove('open'); }

$('rank').addEventListener('click', e => {
  const li = e.target.closest('li[data-code]'); if (!li) return;
  openNote(li.dataset.iso, li.dataset.code);
});
$('rank').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const li = e.target.closest('li[data-code]'); if (!li) return;
  e.preventDefault(); openNote(li.dataset.iso, li.dataset.code);
});
$('nBody').addEventListener('click', e => {
  if (e.target.closest('#allBtn')) {
    note.all = !note.all;
    if (note.all && histCache[note.code] && !histCache[note.code].html) delete histCache[note.code];
    renderNote();
    if (note.all) { loadHistory(note.code); loadPhoto(note.code); }
    return;
  }
  const b = e.target.closest('.chip'); if (!b) return;
  note.idx = +b.dataset.i;
  const pk = note.code + '|' + NOTES[note.code][note.idx];
  if (photoCache[pk] === null) delete photoCache[pk];
  renderNote();
  loadPhoto(note.code);
});
$('nClose').onclick = closeNote;
$('noteOverlay').addEventListener('click', e => { if (e.target === $('noteOverlay')) closeNote(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNote(); });
